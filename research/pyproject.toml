[project]
name = "triage-research"
version = "0.1.0"
description = "Reproducible converters, fetcher and reference implementations for Triage model artifacts."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "torch",
  "transformers",
  "onnx",
  "onnxruntime==1.31.0",
  "safetensors",
  "tokenizers==0.23.3",
  "numpy",
  "pyyaml",
  "huggingface_hub",
  "httpx",
  "requests",
  "onnx-ir>=1.0.0",
  "pyarrow",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "types-PyYAML",
  "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_research", "routellm_ref"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Vendored upstream code (Apache-2.0), kept verbatim apart from marked changes.
extend-exclude = ["routellm_ref"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PT", "ARG", "ERA", "PL", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311"]
# The tokenizer corpus deliberately contains confusable characters (full-width forms,
# Arabic-Indic digits, Kelvin sign, ...); invisible ones are written as escapes.
"src/triage_research/reference_tokenize.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# onnxruntime and pyarrow ship no type information.
module = ["onnxruntime", "onnxruntime.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Vendored upstream code is untyped by design (kept verbatim).
module = ["routellm_ref", "routellm_ref.*"]
ignore_errors = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
