apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage
  labels:
    app.kubernetes.io/name: triage
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: triage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triage
          image: ghcr.io/thnhdatle/triage:v0.1.0
          args: ["serve", "--config", "/etc/triage/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9091
          envFrom:
            - secretRef:
                name: triage-secrets
                optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/triage
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: triage-config
        - name: tmp
          emptyDir: {}
