# SPDX-License-Identifier: Apache-2.0
name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rayld/triage
          key: rayld-triage-${{ hashFiles('models/manifest.yaml') }}
      - run: scripts/ci-install-tools.sh
      - name: Install ONNX Runtime (pinned in models/manifest.yaml)
        run: |
          scripts/stage-ort.sh "$RUNNER_TEMP/ort"
          echo "TRIAGE_ONNX_LIBRARY_PATH=$RUNNER_TEMP/ort/libonnxruntime.so" >> "$GITHUB_ENV"
      - run: make bootstrap
      - run: make fuzz
