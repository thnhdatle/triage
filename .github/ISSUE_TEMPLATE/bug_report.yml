name: Bug report
description: Report something that does not work as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `triage --version` or the image tag
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant config, with secrets removed
      render: yaml
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with prompts and personal data removed
      render: text
