# TRG-10, MMLU part: 2,000 fixed items, correctness from RouteLLM's published labels (GPT-4-1106 vs Mixtral).
# No LLM calls. The GSM8K part is eval/trg10_gsm8k.yaml.
mode: labels
config: deploy/config.example.yaml        # route triage-auto; its difficulty.bert.variant selects the INT8 model
route: triage-auto
dataset:
  sets: [eval/sets/trg10_mmlu.txt]
  labels: { weak: mistralai/Mixtral-8x7B-Instruct-v0.1, strong: gpt-4-1106-preview }
strategies: [random, bert, mf]            # mf only when OPENAI_API_KEY is set (informational)
bootstrap: { resamples: 10000, seed: 7 }
cache_dir: ~/.cache/rayld/triage/eval
