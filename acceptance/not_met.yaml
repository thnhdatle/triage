# Explanations of FAIL rows, read by acceptance/cmd/runner into the "Not met" section of report.md.
TRG-03:
  cause: >-
    the result depends on the weak/strong model pair. The pretrained bert checkpoint was trained on
    GPT-4 versus Mixtral outcomes and does not rank the qwen3-vl-4b / gemma-4-26b pair better than
    random (AUC for weak-wrong/strong-right items 0.37 on the calibration set, 0.33 on the eval
    set), so keeping 96% of the all-strong calibration accuracy takes about 90% strong calls: eval
    strong ratio 0.93, cost 92.3% of all-strong (threshold 75%), accuracy 0.920 against 0.932
    expected from random routing at the same ratio (accuracy ratio 0.979 meets its 0.95
    threshold); all-weak 0.82, all-strong 0.94. On the same run the length strategy reaches 58.4%
    of the all-strong cost at accuracy 0.910. No defect was found in scoring, calibration or cost
    accounting; this is a known limitation of v0.1 (calibrate for your own model pair)
