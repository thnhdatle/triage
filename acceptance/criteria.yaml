project: triage
machine: "MacBook Pro M3 Pro 36 GB, Docker VM 8 CPU / 10 GB"
# Each criterion has thresholds for the reference machine (pass.mac) and for CI
# runners (pass.ci, selected with CI=1; `skip` where it cannot run on CI). Tests
# read them at run time.
# kind: functional (behaviour and correctness), performance (calibrated for the
# reference machine), evaluation (routing quality on benchmark data) or release
# (quickstart from a clean checkout).
criteria:
  - id: TRG-01
    title: "PII never reaches a cloud target unmasked"
    test: TestAcceptance_TRG01_PIINeverLeaves
    kind: functional
    real_deps: [fakellm]
    requires: [docker]
    pass:
      mac: { leaked_values: 0, cases_min: 500, dropped: 0 }
      ci: { leaked_values: 0, cases_min: 500, dropped: 0 }

  - id: TRG-02
    title: "Router overhead with length strategy and privacy mask at 500 RPS"
    test: BenchmarkAcceptance_TRG02_Overhead
    kind: performance
    real_deps: [fakellm]
    requires: [docker, mac]
    pass:
      mac: { rps: 500, duration_s: 60, p99_overhead_ms_max: 5 }
      ci: { rps: 500, duration_s: 60, p99_overhead_ms_max: 15 }

  - id: TRG-03
    title: "Cost-quality trade-off on 100 eval items with a weak/strong LM Studio pair"
    test: TestAcceptance_TRG03_CostQuality
    kind: evaluation
    real_deps: [lmstudio]
    requires: [lmstudio, mac]
    pass:
      mac:
        eval_items: 100
        calibration_items: 100
        cost_ratio_max: 0.75
        accuracy_ratio_min: 0.95
        accuracy_vs_random_min_delta: 0.0
        cost_ratio_target_report_only: 0.60
        min_accuracy_of_all_strong_calibration: 0.96
      ci: skip

  - id: TRG-04
    title: "Fallback success over 1,000 scripted failures"
    test: TestAcceptance_TRG04_Fallback
    kind: functional
    real_deps: [fakellm]
    requires: [docker]
    pass:
      mac: { complete_ratio_min: 0.99, privacy_violations: 0, scripted_failures: 1000, concurrency: 50 }
      ci: { complete_ratio_min: 0.99, privacy_violations: 0, scripted_failures: 1000, concurrency: 50 }

  - id: TRG-05
    title: "Official OpenAI SDKs (Python, Node) run an unmodified script"
    test: TestAcceptance_TRG05_SDKCompat
    kind: functional
    real_deps: [fakellm, python, node]
    requires: [docker, python, node]
    pass:
      mac: { script_checks_passed_ratio: 1.0 }
      ci: { script_checks_passed_ratio: 1.0 }

  - id: TRG-06
    title: "Mask round-trip restores every placeholder exactly"
    test: TestAcceptance_TRG06_MaskRoundTrip
    kind: functional
    real_deps: [fakellm]
    requires: [docker]
    pass:
      mac: { restored_ratio: 1.0, cases_min: 500, tool_call_cases_min: 50, dropped: 0 }
      ci: { restored_ratio: 1.0, cases_min: 500, tool_call_cases_min: 50, dropped: 0 }

  - id: TRG-07
    title: "Hot reload under load causes no router-side 5xx"
    test: TestAcceptance_TRG07_HotReload
    kind: functional
    real_deps: [fakellm]
    requires: [docker]
    pass:
      mac: { reloads: 100, rps: 200, router_5xx: 0, invalid_applied: 0 }
      ci: { reloads: 100, rps: 200, router_5xx: 0, invalid_applied: 0 }

  - id: TRG-08
    title: "Throughput with length strategy"
    test: BenchmarkAcceptance_TRG08_Throughput
    kind: performance
    real_deps: [fakellm]
    requires: [docker, mac]
    pass:
      mac: { rps_min: 3000, p99_ms_max: 20 }
      ci: { rps_min: 900 }

  - id: TRG-09
    title: "Every response has a decision, spans carry route, score and tier"
    test: TestAcceptance_TRG09_Decisions
    kind: functional
    real_deps: [fakellm, otel-inmemory]
    requires: [docker]
    pass:
      mac: { requests: 1000, covered_ratio: 1.0 }
      ci: { requests: 1000, covered_ratio: 1.0 }

  - id: TRG-10
    title: "Offline routing quality beats random on RouteLLM labels"
    test: TestAcceptance_TRG10_StrategiesBeatRandom
    kind: evaluation
    real_deps: [network]
    requires: [network]
    pass:
      mac: { gsm8k_apgr_bert_min: 0.51 }
      ci: skip

  - id: TRG-11
    title: "Go/Python parity of tokenizer, bert and mf"
    test: TestAcceptance_TRG11_Parity
    kind: functional
    real_deps: [python]
    requires: [python]
    pass:
      mac:
        tokenizer_identity_ratio: 1.0
        ort_go_vs_python_max_abs_dp: 0.0001
        fp32_vs_torch_max_abs_dp: 0.0001
        int8_agreement_min: 0.97
        mf_max_abs_dp: 0.00001
      ci:
        tokenizer_identity_ratio: 1.0
        ort_go_vs_python_max_abs_dp: 0.0001
        fp32_vs_torch_max_abs_dp: 0.0001
        int8_agreement_min: report_only
        mf_max_abs_dp: 0.00001

  - id: TRG-12
    title: "Quickstart works with and without a downloaded checkpoint"
    test: TestAcceptance_TRG12_Quickstart
    kind: release
    real_deps: [docker, network]
    requires: [docker, network]
    pass:
      mac: { step1_max_minutes: 5, step2_max_minutes: 5 }
      ci: { step1_max_minutes: 5, step2_max_minutes: 5 }

  - id: TRG-13
    title: "bert scoring latency in-process"
    test: BenchmarkAcceptance_TRG13_StrategyLatency
    kind: performance
    real_deps: []
    requires: [mac]
    pass:
      mac: { prompts: 1000, rps: 5, p99_ms_max: 250 }
      ci: skip
